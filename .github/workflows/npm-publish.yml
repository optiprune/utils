name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install locked dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Publish @optiprune/pathx
        run: npm publish --workspace @optiprune/pathx --access public --provenance
        continue-on-error: true

      - name: Publish @optiprune/glob
        run: npm publish --workspace @optiprune/glob --access public --provenance
        continue-on-error: true