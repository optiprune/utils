name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish @optiprune/pathx
        run: pnpm --filter @optiprune/pathx publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish @optiprune/glob
        run: pnpm --filter @optiprune/glob publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Rename to microglob & publish
        working-directory: packages/glob
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");

            // 1. Update package.json
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "microglob";
            delete pkg.repository?.directory;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");

            // 2. Replace @optiprune/glob with microglob across text files
            const extensions = new Set([".md", ".js", ".mjs", ".cjs", ".ts", ".d.ts", ".json"]);

            function replaceInDir(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory() && entry.name !== "node_modules") {
                  replaceInDir(fullPath);
                } else if (entry.isFile() && extensions.has(path.extname(entry.name))) {
                  const content = fs.readFileSync(fullPath, "utf8");
                  if (content.includes("@optiprune/glob")) {
                    fs.writeFileSync(fullPath, content.replaceAll("@optiprune/glob", "microglob"));
                  }
                }
              }
            }

            replaceInDir(".");
          '
          pnpm publish --access public --no-git-checks --provenance --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true
