name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Vitest will filter tests matching the glob directory path
      - name: Run Glob Tests
        run: npm run test -- packages/glob

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: optiprune/glob
          flags: glob-${{ matrix.os }}-node-${{ matrix.node-version }}
          name: codecov-${{ matrix.os }}-node-${{ matrix.node-version }}-glob
          fail_ci_if_error: false
        continue-on-error: true

      - name: Run PathX Tests
        run: npm run test --workspace @optiprune/pathx
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: optiprune/pathx
          flags: pathx-${{ matrix.os }}-node-${{ matrix.node-version }}
          name: codecov-${{ matrix.os }}-node-${{ matrix.node-version }}-pathx
          fail_ci_if_error: false
        continue-on-error: true
