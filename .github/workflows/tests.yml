name: Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    name: Validate (${{ matrix.os }}, Node${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      # 1. Install pnpm first so setup-node can cache its store
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # 2. Setup Node and enable pnpm caching
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # 3. pnpm equivalent of `npm ci`
      - run: pnpm install --frozen-lockfile

      # 4. Filter tests by workspace/package
      - name: Run Glob Tests
        run: pnpm --filter @optiprune/glob test

      - name: Upload coverage reports to Codecov (Glob)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: optiprune/glob
          flags: glob-${{ matrix.os }}-node-${{ matrix.node-version }}
          name: codecov-${{ matrix.os }}-node-${{ matrix.node-version }}-glob
          fail_ci_if_error: false
        continue-on-error: true

      - name: Run PathX Tests
        run: pnpm --filter @optiprune/pathx test

      - name: Upload coverage reports to Codecov (PathX)
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: optiprune/pathx
          flags: pathx-${{ matrix.os }}-node-${{ matrix.node-version }}
          name: codecov-${{ matrix.os }}-node-${{ matrix.node-version }}-pathx
          fail_ci_if_error: false
        continue-on-error: true